services:
  # Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: estate_hunter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estate_hunter_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-estate_hunter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-estate} -d $${POSTGRES_DB:-estate_hunter}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Web Dashboard Service (Interactive CRM, Map, Configuration UI)
  dashboard:
    # Publiczny gotowy obraz z GHCR (po release). Lokalnie nadal działa `docker compose up --build`.
    image: ghcr.io/p-sternik/universal-real-estate-hunter:${IMAGE_TAG:-latest}
    build: .
    container_name: estate_hunter_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-estate}:${POSTGRES_PASSWORD:-estate_hunter_secret_pass}@db:5432/${POSTGRES_DB:-estate_hunter}}
      - SEARCH_CONFIG_PATH=/app/data/search_config.json
      - TZ=Europe/Warsaw
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - estate_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/config', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: ["python", "main.py", "dashboard", "--host", "0.0.0.0", "--port", "8080", "--no-open"]

  # Automated Background Scraper & Monitoring Daemon
  scraper:
    image: ghcr.io/p-sternik/universal-real-estate-hunter:${IMAGE_TAG:-latest}
    build: .
    container_name: estate_hunter_scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dashboard:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-estate}:${POSTGRES_PASSWORD:-estate_hunter_secret_pass}@db:5432/${POSTGRES_DB:-estate_hunter}}
      - SEARCH_CONFIG_PATH=/app/data/search_config.json
      - TZ=Europe/Warsaw
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    volumes:
      - estate_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'main.py run' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    command: ["python", "main.py", "run"]

volumes:
  postgres_data:
  estate_data:
