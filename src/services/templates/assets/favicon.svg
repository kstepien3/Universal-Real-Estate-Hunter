<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121726" />
      <stop offset="100%" stop-color="#07090f" />
    </linearGradient>
    <linearGradient id="roof" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="1.2" />

  <!-- Ambient blue reflection -->
  <circle cx="32" cy="35" r="18" fill="#3b82f6" fill-opacity="0.14" />

  <!-- House Interior Card -->
  <polygon points="32,16.5 46,28 46,49 18,49 18,28" fill="#0f1420" />

  <!-- House Wall Outline -->
  <path d="M 18 28 V 49 H 46 V 28" fill="none" stroke="url(#wall)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Layered Roof Gable -->
  <path d="M 13 29.5 L 32 13.5 L 51 29.5" fill="none" stroke="url(#roof)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Hunter Radar / Crosshair Reticle -->
  <circle cx="32" cy="38.5" r="8.2" fill="#0a0e18" stroke="#38bdf8" stroke-width="2.2" />

  <!-- Crosshairs Ticks -->
  <line x1="32" y1="24.8" x2="32" y2="28.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="32" y1="48.5" x2="32" y2="52.2" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="18.3" y1="38.5" x2="22" y2="38.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="42" y1="38.5" x2="45.7" y2="38.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Glowing Emerald Beacon -->
  <circle cx="32" cy="38.5" r="4.6" fill="#22c55e" fill-opacity="0.25" />
  <circle cx="32" cy="38.5" r="3.0" fill="#22c55e" />
  <circle cx="32" cy="38.5" r="1.3" fill="#f0fdf4" filter="url(#glow)" />
</svg>
