name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "assets/**"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, Types & Security — Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff (lint & format)
        run: |
          uv run ruff check src/ tests/ main.py
          uv run ruff format --check src/ tests/ main.py

      - name: Run mypy
        run: uv run mypy

      - name: Run Bandit
        run: uv run bandit -c pyproject.toml -r src/ main.py -lll -iii

  test:
    name: Tests — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv & Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: uv run pytest tests/ -q -x --tb=short -m "not integration"

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest tests/ -q --tb=short -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=66

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: estate-hunter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm estate-hunter:ci python main.py --help
          docker run --rm estate-hunter:ci python main.py init-db

  release:
    name: Semantic Release
    outputs:
      released: ${{ steps.semantic_release.outputs.released }}
      version: ${{ steps.semantic_release.outputs.version }}
      tag: ${{ steps.semantic_release.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'p-sternik/Universal-Real-Estate-Hunter'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Sync release dependencies
        run: uv sync --frozen --no-install-project

      - name: Run semantic release
        id: semantic_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uvx --with "GitPython<3.1.44" python-semantic-release -v version --changelog

      - name: Verify changelog updated for released tag
        if: steps.semantic_release.outputs.released == 'true'
        shell: bash
        run: |
          TAG="${{ steps.semantic_release.outputs.tag }}"
          if ! grep -q '<!-- version list -->' CHANGELOG.md; then
            echo "CHANGELOG.md is missing the semantic-release insertion flag."
            exit 1
          fi
          if ! grep -q "^## ${TAG}" CHANGELOG.md; then
            echo "CHANGELOG.md was not updated with release ${TAG}."
            exit 1
          fi

      - name: Release summary
        if: always()
        run: |
          echo "released=${{ steps.semantic_release.outputs.released }}"
          echo "version=${{ steps.semantic_release.outputs.version }}"
          echo "tag=${{ steps.semantic_release.outputs.tag }}"

  publish:
    name: Build & push to GHCR (public)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true' && github.repository == 'p-sternik/Universal-Real-Estate-Hunter'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # NOTE: GHCR wymaga małych liter — dlatego hardcoded lowercase,
          # nie ${{ github.repository }} (ma wielkie litery).
          images: ghcr.io/p-sternik/universal-real-estate-hunter
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
